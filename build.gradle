import groovy.json.JsonSlurper

plugins {
    id "java"
}

repositories {
    mavenCentral()
    maven { url "https://repo.gradle.org/gradle/libs-releases" }
    flatDir { dirs mcreator_path + '/lib' }
}

group = 'net.tamashi.fomek'
version = new JsonSlurper().parse(file('src/main/resources/plugin.json'))['info']['version']

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

configurations {
    implementation.extendsFrom export
}

def mcreatorProject = project(':MCreator')

dependencies {
    implementation mcreatorProject
}

// Gradle 9: project() inside dependencies{} returns a ProjectDependency, so the old
// project(':MCreator').afterEvaluate(...) chain is gone. Hoist the Project instead.
mcreatorProject.afterEvaluate {
    def mcreatorImpl = mcreatorProject.configurations.getByName('implementation')
    def pluginImpl = configurations.getByName('implementation')
    mcreatorImpl.dependencies.each { dep ->
        pluginImpl.dependencies.add(dep)
    }
}

tasks.jar {
    archiveFileName.set("fomek-plugin.zip")
    from { configurations.export.collect { it.isDirectory() ? it : zipTree(it) } }
}

tasks.register('runMCreatorWithPlugin', JavaExec) {
    dependsOn jar
    environment("MCREATOR_PLUGINS_FOLDER", file("./build/libs"))
    jvmArgs '--add-opens', 'java.base/java.lang=ALL-UNNAMED'
    classpath = project(':MCreator').sourceSets.main.runtimeClasspath
    main = 'net.mcreator.Launcher'
    workingDir = mcreator_path
}

sourceSets {
    loadtest {
        java.srcDirs = ['tests-load']
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }
}

tasks.register('pluginLoadTest', JavaExec) {
    dependsOn jar, compileLoadtestJava
    description = 'Headless load of fomek-plugin.zip inside MCreator 2026.2 (no GUI needed)'
    environment("MCREATOR_PLUGINS_FOLDER", layout.buildDirectory.dir("libs").get().asFile.absolutePath)
    classpath = sourceSets.loadtest.runtimeClasspath
    mainClass = 'net.tamashi.fomek.test.PluginLoadTest'
    jvmArgs '--add-opens', 'java.base/java.lang=ALL-UNNAMED', '--enable-native-access=ALL-UNNAMED,jcef'
    workingDir = mcreator_path
}
