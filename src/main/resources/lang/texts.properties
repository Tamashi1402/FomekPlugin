blockly.block.entity_set_anger_time=Set anger time of neutral entity %1 to %2
blockly.block.entity_set_anger_time.tooltip=[SP] When any neutral entity is angered, this is set to a random value between 400 and 1100 ticks. This timer is not reset or extended by attacking the entity.\n
blockly.block.entity_set_discard_friction=Set friction of %1 to %2
blockly.block.entity_set_discard_friction.tooltip=[SP] More commonly recognized as the Aether''s quicksoil effect
blockly.block.entity_set_hitbox=Set new hitbox dimensions of entity to width: %1 height: %2
blockly.block.entity_set_idle_time=Set idle time of %1 to %2
blockly.block.entity_set_idle_time.tooltip=[SP] A vanilla timer on mob entities (internally referred to as 'noActionTime') that increases for every tick they're at least 32 blocks from the player. When this timer is greater than 100 ticks, most mobs are programmed to not wander around aimlessly but otherwise behave as normal. When this timer is greater than 600 ticks, mobs begin to randomly despawn if they're also at least 32 blocks from the player. When this timer is less than 600 ticks, mobs do not despawn as long as they're within 128 blocks of the player.
blockly.block.entity_set_noai=Set NoAI of%1 to%2
