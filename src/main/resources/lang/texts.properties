blockly.block.entity_get_effects_string.tooltip=[SP]
blockly.block.entity_get_fall_distance=Get the fall distance of%1
blockly.block.entity_get_fall_distance.tooltip=[SP] Returns the entity''s current fall distance
blockly.block.entity_get_hurt_time=Get remaining damage immunity ticks for %1
blockly.block.entity_get_hurt_time.tooltip=[SP]
blockly.block.entity_get_idle_time=Get idle time of %1
blockly.block.entity_get_idle_time.tooltip=[SP] A vanilla timer on mob entities (internally referred to as 'noActionTime') that increases for every tick they're at least 32 blocks from the player. When this timer is greater than 100 ticks, most mobs are programmed to not wander around aimlessly but otherwise behave as normal. When this timer is greater than 600 ticks, mobs begin to randomly despawn if they're also at least 32 blocks from the player. When this timer is less than 600 ticks, mobs do not despawn as long as they're within 128 blocks of the player.
blockly.block.entity_get_last_damagesource=%2 Get most recent damage source for %1
blockly.block.entity_get_last_damagesource.tooltip=[SP] Returns the last damage source dealt to the target entity, if one exists. Resets to 'null' after 5 seconds or when the world is reloaded
blockly.block.entity_get_last_hurt_by_mob=%2 Get last entity that attacked %1
blockly.block.entity_get_last_hurt_by_mob.tooltip=[SP] Returns the most recent entity that dealt damage to the target entity, if one exists. Resets to 'null' after 5 seconds, or when the entity dies, or when the world is reloaded
blockly.block.entity_get_last_hurt_mob=%2 Get last entity attacked by %1
blockly.block.entity_get_last_hurt_mob.tooltip=[SP] Returns the most recent entity that the target entity dealt damage to, if one exists. Resets to 'null' after 5 seconds, when the entity dies, or when the world is reloaded
blockly.block.entity_get_noai=Has%1 No AI
blockly.block.entity_get_number_id=Get numerical ID of%1
blockly.block.entity_get_permission_level=Get permission level of%1
blockly.block.entity_get_persistence=Is mob%1 persistent
blockly.block.entity_get_persistence.tooltip=[SP] Mobs with ''persistence required'' do not despawn naturally
blockly.block.entity_get_portal_cooldown=Get portal cooldown of %1
blockly.block.entity_get_portal_cooldown.tooltip=[SP] Defaults to zero. Set to 10 ticks when a player changes dimensions using a nether portal, and 300 ticks for all other entities. Decrements every tick the entity is not inside a nether portal. While greater than 0, the entity cannot use nether portals
blockly.block.entity_get_swing_progress=Get arm swing progress of %1
blockly.block.entity_get_swing_progress.tooltip=[SP] Returns the fraction by which the entity''s arm swing animation is complete. Seems to only detect swinging caused by left-clicking
blockly.block.entity_get_swing_ticks=Get arm swing ticks of %1
blockly.block.entity_get_swing_ticks.tooltip=[SP] Returns the number of ticks for which the entity''s arm has been swinging. Seems to only detect swinging caused by left-clicking
blockly.block.entity_get_tick_count=Get tick count of %1
blockly.block.entity_get_tick_count.tooltip=[SP] Returns the number of ticks that an entity has existed for. Increments every tick that the entity is loaded, resets to zero when the entity or the world are reloaded
blockly.block.entity_get_ticks_since_attacking=Get ticks since %1 attacked
blockly.block.entity_get_ticks_since_attacking.tooltip=[SP] Does what it says. Resets to zero when the entity or the world are reloaded
blockly.block.entity_get_ticks_since_was_attacked=Get ticks since %1 was attacked
blockly.block.entity_get_ticks_since_was_attacked.tooltip=[SP] Does what it says. Resets to zero when the entity or the world are reloaded
blockly.block.entity_get_xp_reward=Get XP reward for killing %1
