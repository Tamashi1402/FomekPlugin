blockly.block.entity_minecart_can_use_rails.tooltip=[SP]
blockly.block.entity_minecart_get_direction=Get direction minecart %1 is traveling
blockly.block.entity_minecart_get_direction.tooltip=[SP]
blockly.block.entity_minecart_is_on_rails=Is minecart %1 on rails
blockly.block.entity_minecart_is_on_rails.tooltip=[SP] Returns true if the minecart is locked onto a rail block
blockly.block.entity_minecart_override_speed=Double the current speed of minecart %1 for the current tick
blockly.block.entity_minecart_override_speed.tooltip=[SP] Weirdly, this is the only way to make a minecart travel faster than the vanilla speed cap of 0.4 blocks/s. Applied on top of the cart's max speed. Must be run every tick in order to work. Only applied when the cart is on rails
blockly.block.entity_minecart_set_can_use_rails=Allow minecart %1 to use rails if %2, otherwise derail
blockly.block.entity_minecart_set_can_use_rails.tooltip=[SP] Toggles whether a minecart can lock onto rail blocks without derailing when the minecart must be nudged (or otherwise have its velocity changed). Note that the minecart can still briefly lock onto rails.\n
blockly.block.entity_minecart_set_max_speed=Set max speed of minecart %1 to %2
blockly.block.entity_minecart_set_max_speed.tooltip=[SP] This value is ''0.4'' by default, equivalent to a speed of 20 * 0.4 = 8 blocks/s. Values lower than 0.4 work as expected, but setting a value greater than 0.4 does not actually increase the cart's speed cap by itself.\n
