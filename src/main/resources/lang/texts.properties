blockly.block.entity_is_in_any_fluid.tooltip=[SP] Shortcut for testing whether an entity is in contact with any fluid
blockly.block.entity_is_mouth_in_fluid_type=Is mouth of %1 in fluid type %2
blockly.block.entity_is_mouth_in_fluid_type.tooltip=[SP] Returns true when the entity's ''mouth'' is submerged. This is the condition for which an entity will begin to lose breath in water. Notably, this depth is slightly below the depth at which the entity's camera (at eye-level) enters the fluid
blockly.block.entity_is_pathfinding_to_target=Is %1 pathfinding to attack target
