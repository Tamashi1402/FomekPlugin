blockly.block.entity_get_death_time=Get ticks since %1 was killed
blockly.block.entity_get_death_time.tooltip=[SP] Returns 0 while an entity is alive. When killed, this value increments every tick during the entity''s death animation (where they fall over and then ''poof'') until it reaches 20, at which point the entity despawns
blockly.block.entity_get_default_name=Get type name of%1
