blockly.block.entity_is_angered.tooltip=[SP]
blockly.block.entity_is_colliding=Is %1 colliding with another entity
blockly.block.entity_is_colliding.tooltip=[SP] Returns true if the entity''s bounding box is interacting with that of another entity, or if the entity performs a melee attack.\n
blockly.block.entity_is_holding_item=Is %1 holding %2
