blockly.block.entity_is_type=Is %1 of type %2
blockly.block.entity_is_type.tooltip=[SP] Returns true if the provided entity is of the specified type. ''non-mob'' also excludes players. ''neutral mob'' includes bees, endermen, iron golems, polar bears, wolves and ziglins. ''projectile'' excludes thrown eyes of ender. ''animal'' includes (aside from the obvious mobs) fish (except guardians), squids, axolotls, bats, bees, hoglins and striders, and excludes iron golems and snow golems. ''pet'' includes only cats, wolves and parrots. ''pseudo-tamable'' includes entities that can sort of be tamed, including axolotls, ocelots, foxes and all horses or mobs that resemble a horse. ''villager'' also includes wandering traders. ''normal zombie'' includes only zombies, zombie villagers, husks and drowned. ''all zombies'' also includes ziglins, zoglins and zombie horses. ''aquatic creature'' includes all fish as well as axolotls, dolphins, tadpoles, turtles, squids and guardians, but not drowned or frogs. ''hangable'' includes item frames and paintings
blockly.block.entity_is_using_item=Is entity %1 using an item
blockly.block.entity_is_using_item.tooltip=[SP]
blockly.block.entity_line_of_sight_check=Can%1 find%2
